<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>plates A — preview (03–11, 18)</title>
<style>
  :root {
    --paper: #fbf9f3;
    --panel: #f4efe2;
    --ink: #3a352c;
    --earth: #8a6f44;
    --sand: #c8b88a;
    --gray: #847d6e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.6;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 72px 24px 120px;
  }
  .note-top {
    text-align: center;
    font-style: italic;
    color: var(--gray);
    font-size: 15px;
    letter-spacing: 0.04em;
    margin-bottom: 80px;
  }
  .note-top::after {
    content: "";
    display: block;
    width: 48px;
    height: 1px;
    background: var(--sand);
    margin: 28px auto 0;
  }
  figure { margin: 0 0 110px; }
  figure:last-child { margin-bottom: 0; }
  .plate {
    background: var(--panel);
    border: 1px solid #e6dec8;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(58,53,44,0.05), 0 12px 32px -16px rgba(58,53,44,0.18);
  }
  .plate img { display: block; width: 100%; height: auto; }
  figcaption {
    text-align: center;
    font-style: italic;
    color: var(--gray);
    font-size: 17px;
    margin-top: 22px;
  }
  .plate-num {
    text-align: center;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #b3a98f;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
<main>
  <p class="note-top">plates 03&ndash;11 and 18 &mdash; batch A</p>

  <figure>
    <div class="plate-num">Plate 03 &middot; &sect;3 &middot; What C is &mdash; love</div>
    <div class="plate"><img src="plates/love.svg" alt="Plate 3 — small acts with love"></div>
    <figcaption>The light chooses the small act.</figcaption>
  </figure>

  <figure>
    <div class="plate-num">Plate 04 &middot; &sect;4 &middot; Who you are &mdash; and the drift</div>
    <div class="plate"><img src="plates/string.svg" alt="Plate 4 — the string never snaps"></div>
    <figcaption>The string never snaps.</figcaption>
  </figure>

  <figure>
    <div class="plate-num">Plate 05 &middot; &sect;5 &middot; The fall</div>
    <div class="plate"><img src="plates/garden.svg" alt="Plate 5 — he came looking, and brought coats"></div>
    <figcaption>He came looking &mdash; and brought coats.</figcaption>
  </figure>

  <figure>
    <div class="plate-num">Plate 06 &middot; &sect;6 &middot; What evil is</div>
    <div class="plate"><img src="plates/06-light.svg" alt="Plate 6 — darkness is only where light isn't yet"></div>
    <figcaption>Darkness is only where light isn&rsquo;t yet.</figcaption>
  </figure>

  <figure>
    <div class="plate-num">Plate 07 &middot; &sect;7 &middot; Alpha and Omega</div>
    <div class="plate"><img src="plates/road.svg" alt="Plate 7 — home, but better"></div>
    <figcaption>Home, but better.</figcaption>
  </figure>

  <figure>
    <div class="plate-num">Plate 08 &middot; &sect;8 &middot; The rules &mdash; an X-ray, not a ladder</div>
    <div class="plate"><img src="plates/xray.svg" alt="Plate 8 — the picture shows, the doctor heals"></div>
    <figcaption>The picture shows. The doctor heals.</figcaption>
  </figure>

  <figure>
    <div class="plate-num">Plate 09 &middot; &sect;9 &middot; C is the way</div>
    <div class="plate"><img src="plates/bridge.svg" alt="Plate 9 — the bridge was built from the other side"></div>
    <figcaption>The bridge was built from the other side.</figcaption>
  </figure>

  <figure>
    <div class="plate-num">Plate 10 &middot; &sect;10 &middot; Who pays for the broken lamp</div>
    <div class="plate"><img src="plates/paid.svg" alt="Plate 10 — paid, and alive"></div>
    <figcaption>Paid &mdash; and alive.</figcaption>
  </figure>

  <figure>
    <div class="plate-num">Plate 11 &middot; &sect;11 &middot; Works and grace</div>
    <div class="plate"><img src="plates/gift.svg" alt="Plate 11 — open your hand"></div>
    <figcaption>Open your hand.</figcaption>
  </figure>

  <figure>
    <div class="plate-num">Plate 18 &middot; &sect;18 &middot; The direction of faith</div>
    <div class="plate"><img src="plates/hand.svg" alt="Plate 18 — the wrong hand"></div>
    <figcaption>The wrong hand.</figcaption>
  </figure>

</main>
</body>
</html>
