<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>plates — preview</title>
<style>
  :root {
    --paper: #fbf9f3;
    --panel: #f4efe2;
    --ink: #3a352c;
    --earth: #8a6f44;
    --sand: #c8b88a;
    --gray: #847d6e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.6;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 72px 24px 120px;
  }
  .note-top {
    text-align: center;
    font-style: italic;
    color: var(--gray);
    font-size: 15px;
    letter-spacing: 0.04em;
    margin-bottom: 80px;
  }
  .note-top::after {
    content: "";
    display: block;
    width: 48px;
    height: 1px;
    background: var(--sand);
    margin: 28px auto 0;
  }
  figure { margin: 0 0 110px; }
  figure:last-child { margin-bottom: 0; }
  .plate {
    background: var(--panel);
    border: 1px solid #e6dec8;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(58,53,44,0.05), 0 12px 32px -16px rgba(58,53,44,0.18);
  }
  .plate svg { display: block; width: 100%; height: auto; }
  figcaption {
    text-align: center;
    font-style: italic;
    color: var(--gray);
    font-size: 17px;
    margin-top: 22px;
  }
  .plate-note {
    max-width: 560px;
    margin: 14px auto 0;
    text-align: center;
    font-size: 13.5px;
    color: #a39a87;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    line-height: 1.55;
  }
  .plate-num {
    text-align: center;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #b3a98f;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
<main>
  <p class="note-top">three sample plates — one style, for approval</p>

  <!-- ============================================================ -->
  <!-- PLATE 1 — The first flame                                    -->
  <!-- ============================================================ -->
  <figure>
    <div class="plate-num">Plate I &middot; &sect;2</div>
    <div class="plate">
      <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img">
        <title>The first flame — a great flame descends through darkness toward a child's small unlit candle</title>
        <defs>
          <radialGradient id="p1-glow" cx="0.5" cy="0.36" r="0.52">
            <stop offset="0" stop-color="#f0d489" stop-opacity="0.34"/>
            <stop offset="0.45" stop-color="#f0d489" stop-opacity="0.08"/>
            <stop offset="1" stop-color="#f0d489" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="p1-floor" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#f0d489" stop-opacity="0.10"/>
            <stop offset="1" stop-color="#f0d489" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- night field -->
        <rect width="800" height="500" fill="#2c2833"/>
        <!-- the glow around the descending flame -->
        <rect width="800" height="500" fill="url(#p1-glow)"/>

        <!-- faint floor line / reflected light -->
        <ellipse cx="400" cy="472" rx="270" ry="26" fill="url(#p1-floor)"/>

        <!-- descending flame — tongue pointing down, the moment before -->
        <g>
          <!-- outer flame -->
          <path fill="#f0d489" d="M400,254
            C 383,228 374,204 374,184
            C 374,158 385,139 396,128
            C 393,118 395,108 402,100
            C 404,110 410,118 417,127
            C 424,139 430,158 428,184
            C 426,206 416,230 400,254 Z"/>
          <!-- inner core -->
          <path fill="#fbf9f3" d="M400,238
            C 391,219 386,202 386,188
            C 386,170 392,156 400,148
            C 408,156 414,170 414,188
            C 414,202 409,220 400,238 Z"/>
        </g>

        <!-- falling motes of light -->
        <circle cx="376" cy="282" r="2.4" fill="#f0d489" opacity="0.55"/>
        <circle cx="420" cy="298" r="1.8" fill="#f0d489" opacity="0.40"/>
        <circle cx="398" cy="316" r="1.4" fill="#f0d489" opacity="0.30"/>

        <!-- the child, looking up, candle raised directly under the flame -->
        <g>
          <!-- body: nightgown silhouette, leaning back slightly to look up -->
          <path fill="#1f1b26" d="M342,470
            C 342,433 348,405 358,389
            C 363,380 370,376 378,376
            C 386,376 393,381 398,390
            C 407,406 412,434 412,470 Z"/>
          <!-- head in profile, tilted back, face to the flame -->
          <circle cx="370" cy="354" r="16" fill="#1f1b26"/>
          <!-- upturned nose -->
          <path fill="#1f1b26" d="M382,344 C 386,342 389,342 391,344 C 389,347 386,349 382,350 Z"/>
          <!-- rim light along the upturned face, toward the flame -->
          <path fill="#f0d489" opacity="0.55" d="M370,338
            A 16,16 0 0 1 386,354
            L 383,354
            A 13,13 0 0 0 370,341 Z"/>
          <!-- raised arms, candle held above head height -->
          <path fill="#1f1b26" d="M366,398
            C 370,389 377,382 385,378
            L 393,387
            C 387,392 381,398 377,406 Z"/>
          <!-- the candle, unlit, on the flame's axis -->
          <rect x="394" y="344" width="9" height="44" rx="3" fill="#f4efe2"/>
          <!-- wick -->
          <path d="M398.5,344 C 398.5,340 397.5,338 398.5,335" stroke="#15121d" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <!-- hands wrapped at candle base -->
          <ellipse cx="398" cy="389" rx="8" ry="6" fill="#1f1b26"/>
          <!-- gold edge where the glow lands on the gown's shoulder -->
          <path fill="#f0d489" opacity="0.22" d="M392,384
            C 398,392 403,404 406,418
            C 402,406 397,396 390,388 Z"/>
        </g>
      </svg>
    </div>
    <figcaption>&ldquo;Something was already burning before you.&rdquo;</figcaption>
    <p class="plate-note">Darkness holds nine-tenths of the frame on purpose: the flame is small but it owns the page. The 90-pixel gap between flame and wick is the whole picture &mdash; the moment before, not the lighting itself.</p>
  </figure>

  <!-- ============================================================ -->
  <!-- PLATE 2 — The wrong hand                                     -->
  <!-- ============================================================ -->
  <figure>
    <div class="plate-num">Plate II &middot; &sect;18</div>
    <div class="plate">
      <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img">
        <title>The wrong hand — a small child in a busy store grips a coat that is almost the right color, while the right figure stands far behind, turned</title>

        <!-- store: wall and floor, child's eye height -->
        <rect width="800" height="500" fill="#f4efe2"/>
        <rect y="396" width="800" height="104" fill="#e7dfca"/>
        <line x1="0" y1="396" x2="800" y2="396" stroke="#d8cdae" stroke-width="1.5"/>

        <!-- ============ far background: the right figure, smaller, turned, searching ============ -->
        <g>
          <!-- soft shadow -->
          <ellipse cx="150" cy="428" rx="26" ry="4.5" fill="#3a352c" opacity="0.06"/>
          <!-- deep green coat, three-quarter turned -->
          <path fill="#4a5d33" d="M132,428
            C 130,398 130,370 135,350
            C 138,337 145,330 152,330
            C 159,330 165,337 168,350
            C 173,370 173,398 171,428 Z"/>
          <!-- head, turned away, looking elsewhere -->
          <circle cx="158" cy="319" r="11" fill="#4a5d33"/>
          <circle cx="167" cy="313" r="4.5" fill="#4a5d33"/>
          <!-- arm raised, holding the child's small red hat -->
          <path fill="#4a5d33" d="M167,352 C 174,345 179,339 183,332 L 190,337 C 185,345 179,352 172,359 Z"/>
          <!-- the child's little red hat, held up -->
          <path fill="#c44747" d="M185,331 a 7.5,7.5 0 0 1 15,0 Z"/>
          <rect x="182" y="330" width="21" height="3.5" rx="1.75" fill="#c44747"/>
          <!-- legs -->
          <rect x="140" y="426" width="8" height="18" fill="#3e4d2b"/>
          <rect x="156" y="426" width="8" height="18" fill="#3e4d2b"/>
          <path fill="#33402a" d="M137,443 L 150,443 L 152,449 L 134,449 Z"/>
          <path fill="#33402a" d="M153,443 L 166,443 L 168,449 L 150,449 Z"/>
        </g>

        <!-- ============ midground forest of coats and legs ============ -->
        <!-- far-left foreground coat, cropped by frame -->
        <g>
          <ellipse cx="30" cy="478" rx="60" ry="9" fill="#3a352c" opacity="0.08"/>
          <path fill="#8a6f44" d="M-20,-10 L 96,-10
            C 100,120 104,250 96,330
            C 92,366 80,386 46,386
            C 8,386 -10,366 -16,322 Z"/>
          <!-- coat opening -->
          <path fill="#74592f" d="M40,-10 L 50,-10 C 48,130 47,260 50,384 C 49,385 47,386 44,386 C 41,386 40,385 39,384 C 37,258 37,128 40,-10 Z"/>
          <!-- hem flare -->
          <path fill="#74592f" opacity="0.5" d="M-16,322 C -8,360 8,382 40,386 C 8,384 -6,362 -12,326 Z"/>
          <rect x="8" y="384" width="26" height="88" fill="#6e5836"/>
          <rect x="52" y="384" width="26" height="88" fill="#6e5836"/>
          <path fill="#54432a" d="M4,470 L 38,470 L 42,480 L 0,480 Z"/>
          <path fill="#54432a" d="M48,470 L 82,470 L 86,480 L 44,480 Z"/>
        </g>

        <!-- mid coat, sand, with a hanging sleeve and hand -->
        <g>
          <ellipse cx="232" cy="462" rx="48" ry="7" fill="#3a352c" opacity="0.07"/>
          <path fill="#c8b88a" d="M196,-10 L 272,-10
            C 276,110 278,230 270,302
            C 266,330 254,342 232,342
            C 206,342 196,328 193,290 Z"/>
          <!-- coat opening -->
          <path fill="#a08a5c" d="M230,-10 L 238,-10 C 237,120 237,230 239,338 C 237,340 235,341 232,341 C 230,341 229,340 228,339 C 227,228 227,118 230,-10 Z"/>
          <rect x="212" y="340" width="18" height="116" fill="#a08a5c"/>
          <rect x="242" y="340" width="18" height="116" fill="#a08a5c"/>
          <path fill="#7c6a44" d="M208,454 L 234,454 L 238,464 L 204,464 Z"/>
          <path fill="#7c6a44" d="M238,454 L 264,454 L 268,464 L 234,464 Z"/>
        </g>

        <!-- mid coat, muted gray, hem swinging — mid-stride -->
        <g>
          <ellipse cx="352" cy="452" rx="44" ry="7" fill="#3a352c" opacity="0.06"/>
          <path fill="#6e6657" d="M320,-10 L 388,-10
            C 392,100 394,210 386,278
            C 383,302 374,313 352,312
            C 330,311 320,296 317,262 Z"/>
          <!-- coat opening -->
          <path fill="#57503f" d="M350,-10 L 358,-10 C 357,110 357,210 359,308 C 357,310 355,311 352,311 C 350,311 349,310 348,309 C 347,208 347,108 350,-10 Z"/>
          <!-- legs mid-step: one forward, one back -->
          <path fill="#57503f" d="M332,308 L 348,310 L 342,448 L 326,446 Z"/>
          <path fill="#57503f" d="M358,310 L 374,308 L 382,446 L 366,448 Z"/>
          <path fill="#403a2c" d="M322,444 L 344,446 L 347,456 L 318,454 Z"/>
          <path fill="#403a2c" d="M364,446 L 386,444 L 390,454 L 361,456 Z"/>
        </g>

        <!-- THE WRONG COAT — olive, almost the right green -->
        <g>
          <ellipse cx="552" cy="468" rx="56" ry="8" fill="#3a352c" opacity="0.08"/>
          <path fill="#74824a" d="M504,-10 L 600,-10
            C 606,120 608,240 598,322
            C 594,350 582,364 554,364
            C 526,364 512,352 507,318
            C 503,288 502,140 504,-10 Z"/>
          <!-- coat opening, slightly parted -->
          <path fill="#5b6638" d="M548,-10 L 558,-10 C 557,130 557,250 559,360 C 557,362 555,363 552,363 C 549,363 547,362 546,361 C 545,248 545,128 548,-10 Z"/>
          <!-- hem fold pulled down into the child's hand -->
          <path fill="#74824a" d="M508,326 C 510,344 514,356 521,362 L 514,372 C 508,362 505,346 504,330 Z"/>
          <path fill="#5b6638" d="M514,372 L 521,362 C 526,366 532,369 540,370 C 530,372 521,373 514,372 Z"/>
          <!-- pull creases radiating from the grip -->
          <path fill="#5b6638" opacity="0.7" d="M516,366 C 524,358 530,348 534,336 L 538,338 C 534,350 527,360 519,368 Z"/>
          <path fill="#5b6638" opacity="0.45" d="M520,368 C 530,362 540,358 550,356 L 550,360 C 540,362 531,366 523,371 Z"/>
          <rect x="524" y="362" width="20" height="98" fill="#5b6638"/>
          <rect x="556" y="362" width="20" height="98" fill="#5b6638"/>
          <path fill="#444c2a" d="M520,458 L 548,458 L 552,470 L 516,470 Z"/>
          <path fill="#444c2a" d="M552,458 L 580,458 L 584,470 L 548,470 Z"/>
        </g>

        <!-- far-right foreground coat, cropped by frame -->
        <g>
          <ellipse cx="760" cy="482" rx="60" ry="9" fill="#3a352c" opacity="0.08"/>
          <path fill="#9b8a6a" d="M706,-10 L 820,-10 L 820,400
            C 800,414 776,420 752,418
            C 726,416 710,400 705,360
            C 699,250 700,120 706,-10 Z"/>
          <!-- coat opening -->
          <path fill="#86755a" d="M754,-10 L 764,-10 C 763,130 763,280 765,414 C 762,416 759,417 755,417 C 752,417 750,416 749,415 C 747,278 748,126 754,-10 Z"/>
          <rect x="724" y="416" width="24" height="58" fill="#7c6a44"/>
          <rect x="762" y="416" width="24" height="58" fill="#7c6a44"/>
          <path fill="#5e4f33" d="M720,472 L 750,472 L 754,482 L 716,482 Z"/>
          <path fill="#5e4f33" d="M758,472 L 788,472 L 792,482 L 754,482 Z"/>
        </g>

        <!-- ============ the child — focal point ============ -->
        <g>
          <ellipse cx="452" cy="476" rx="40" ry="7" fill="#3a352c" opacity="0.10"/>
          <!-- body: red sweater, stretched mid-reach toward the olive hem -->
          <path fill="#c44747" d="M428,420
            C 430,398 436,384 446,378
            C 452,374 460,374 466,378
            C 474,384 478,396 478,414
            L 472,422 L 434,426 Z"/>
          <!-- reaching arm up to the hem -->
          <path fill="#c44747" d="M466,386
            C 478,376 492,366 504,358
            L 512,368
            C 500,376 488,386 478,396 Z"/>
          <!-- hand gripping the pulled-down fold of the hem -->
          <circle cx="513" cy="365" r="7" fill="#e8c9a8"/>
          <!-- head, face up toward the coat -->
          <circle cx="446" cy="362" r="15" fill="#e8c9a8"/>
          <!-- hair -->
          <path fill="#3a352c" d="M432,358 C 432,348 438,340 447,339 C 455,338 461,343 462,350 C 456,346 450,345 444,348 C 438,351 434,355 432,358 Z"/>
          <!-- dot eye, looking up -->
          <circle cx="452" cy="357" r="1.8" fill="#3a352c"/>
          <!-- legs: one heel lifted, on tiptoe -->
          <rect x="436" y="420" width="13" height="48" rx="5" fill="#5a5247"/>
          <path fill="#5a5247" d="M458,418 L 472,420 L 468,460 L 456,458 Z"/>
          <!-- shoes -->
          <path fill="#3a352c" d="M433,466 L 450,466 L 453,474 L 430,474 Z"/>
          <path fill="#3a352c" d="M455,456 C 460,454 466,455 469,458 L 467,466 L 453,464 Z"/>
        </g>
      </svg>
    </div>
    <figcaption>&ldquo;The holding was real both times. The hand makes the difference.&rdquo;</figcaption>
    <p class="plate-note">Everything is cropped at a four-year-old's eye height &mdash; the adults are only coats and legs. The grip on the olive hem is real and earnest; the deep-green figure far left, turned, holding the child's red hat, is for the reader to find first.</p>
  </figure>

  <!-- ============================================================ -->
  <!-- PLATE 3 — He ran                                             -->
  <!-- ============================================================ -->
  <figure>
    <div class="plate-num">Plate III &middot; &sect;13</div>
    <div class="plate">
      <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img">
        <title>He ran — a long road; the returning child has taken three steps, and the father has already run half the road to meet him</title>
        <defs>
          <radialGradient id="p3-sun" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#f0d489" stop-opacity="0.55"/>
            <stop offset="0.55" stop-color="#f0d489" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#f0d489" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- sky -->
        <rect width="800" height="500" fill="#f4efe2"/>
        <!-- low sun, over the house — the light comes from home -->
        <circle cx="650" cy="148" r="170" fill="url(#p3-sun)"/>
        <circle cx="650" cy="148" r="34" fill="#f0d489"/>

        <!-- far hills -->
        <path fill="#aebd7d" d="M0,250 C 120,224 260,238 380,230 C 520,220 640,236 800,222 L 800,320 L 0,320 Z"/>
        <!-- mid hills -->
        <path fill="#8aa75c" d="M0,300 C 150,272 320,290 470,278 C 600,268 700,284 800,272 L 800,420 L 0,420 Z"/>
        <!-- foreground field -->
        <path fill="#6a9b3e" d="M0,380 C 200,356 420,372 620,360 C 700,356 760,362 800,358 L 800,500 L 0,500 Z"/>

        <!-- the road — long, unbroken, from the son's feet to the door -->
        <path fill="#e8dfc6" d="M60,500
          C 150,452 260,408 380,372
          C 500,336 600,308 668,282
          L 686,282
          C 690,270 694,260 698,252
          L 712,252
          C 716,260 718,270 718,280
          C 650,310 540,344 420,382
          C 300,420 190,462 116,500 Z"/>
        <!-- road edge shadow -->
        <path fill="#c8b88a" opacity="0.5" d="M60,500 C 150,452 260,408 380,372 C 500,336 600,308 668,282 L 672,288 C 604,314 504,342 384,378 C 264,414 154,456 70,500 Z"/>

        <!-- the house, small, far right at the road's end -->
        <g>
          <rect x="688" y="220" width="64" height="44" fill="#f8f4e6"/>
          <path fill="#8a6f44" d="M680,222 L 720,192 L 760,222 Z"/>
          <!-- the door, open, gold light inside -->
          <rect x="710" y="234" width="16" height="30" fill="#f0d489"/>
          <!-- tree by the house -->
          <rect x="772" y="226" width="6" height="36" fill="#6e5836"/>
          <circle cx="775" cy="212" r="22" fill="#4a5d33"/>
        </g>

        <!-- ============ the father — already running, full stride ============ -->
        <g transform="translate(6,16)">
          <!-- dust kicked up along the road behind him -->
          <circle cx="462" cy="350" r="12" fill="#c8b88a" opacity="0.50"/>
          <circle cx="484" cy="342" r="8" fill="#c8b88a" opacity="0.38"/>
          <circle cx="502" cy="336" r="5" fill="#c8b88a" opacity="0.26"/>
          <!-- robe streaming behind like a flag -->
          <path fill="#c44747" d="M424,316
            C 438,312 452,310 464,312
            C 460,318 458,324 459,330
            C 451,329 444,330 438,334
            C 442,338 444,343 444,348
            C 436,346 429,342 424,336 Z"/>
          <!-- trailing leg, kicked back high -->
          <path fill="#8a6f44" d="M422,338
            C 430,344 438,349 448,352
            L 445,361
            C 434,358 425,352 417,345 Z"/>
          <!-- leading leg, stretched far forward -->
          <path fill="#8a6f44" d="M412,340
            C 405,348 397,355 388,360
            L 393,368
            C 403,362 412,354 419,346 Z"/>
          <!-- sandals -->
          <path fill="#54432a" d="M386,358 C 382,360 380,363 381,366 L 392,369 L 394,362 Z"/>
          <path fill="#54432a" d="M447,352 C 451,352 454,354 455,357 L 446,362 L 443,356 Z"/>
          <!-- torso, leaning hard toward the son -->
          <path fill="#c44747" d="M405,309
            C 411,303 419,301 426,304
            C 433,308 436,316 434,326
            C 432,337 425,344 415,345
            C 407,346 401,341 400,333
            C 399,324 401,315 405,309 Z"/>
          <!-- both arms thrown forward, open -->
          <path fill="#8a6f44" d="M404,314 C 396,308 387,304 378,302 L 376,310 C 385,312 393,316 400,322 Z"/>
          <path fill="#8a6f44" d="M406,324 C 398,322 389,322 381,324 L 382,332 C 390,330 398,330 405,332 Z"/>
          <!-- head thrust forward, low -->
          <circle cx="396" cy="300" r="10" fill="#e8c9a8"/>
          <!-- hair swept back by speed -->
          <path fill="#847d6e" d="M389,294
            C 393,288 400,286 406,289
            C 411,292 414,297 413,303
            C 416,303 419,305 420,308
            C 415,309 410,308 407,305
            C 407,299 403,295 397,294
            C 394,293 391,294 389,294 Z"/>
        </g>

        <!-- ============ the son — three steps onto the road ============ -->
        <g>
          <!-- worn garment, head low, a small bundle -->
          <path fill="#8a6f44" d="M116,470
            C 116,442 120,422 128,410
            C 132,404 138,401 144,401
            C 150,401 156,404 160,410
            C 168,422 172,442 172,470 Z"/>
          <!-- head, bowed -->
          <circle cx="138" cy="392" r="12" fill="#e8c9a8"/>
          <path fill="#3a352c" d="M127,388 C 128,381 133,376 140,376 C 146,376 150,379 152,384 C 147,381 142,380 137,382 C 132,384 129,386 127,388 Z"/>
          <!-- staff -->
          <line x1="170" y1="396" x2="178" y2="470" stroke="#6e5836" stroke-width="4" stroke-linecap="round"/>
          <!-- bundle on the staff -->
          <circle cx="172" cy="400" r="9" fill="#c8b88a"/>
          <!-- small step: one foot just lifted -->
          <path fill="#54432a" d="M122,468 L 138,468 L 141,476 L 119,476 Z"/>
          <path fill="#54432a" d="M148,464 L 164,466 L 166,474 L 146,472 Z"/>
        </g>
      </svg>
    </div>
    <figcaption>&ldquo;You walk toward Him. He runs.&rdquo;</figcaption>
    <p class="plate-note">The distances are the argument: the son is three steps in, the father has already covered half the road. He is the only running thing in a still landscape &mdash; red robe, dust, full stride &mdash; and the door he left stands open and lit.</p>
  </figure>
</main>
</body>
