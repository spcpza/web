<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { --bg: #141826; --panel: #1d2234; --ink: #efe6d2; --dim: #a9a294; --gold: #e6c27a; --line: #2e3550; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 Georgia, 'Times New Roman', serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; font-weight: normal; margin: 0 8px 0 0; color: var(--gold); letter-spacing: .02em; }
  button, select { font: inherit; color: var(--ink); background: #262c42; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--gold); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  select { max-width: min(62vw, 420px); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 6px 10px; }
  .seg button[aria-pressed="true"] { background: #353d5c; color: var(--gold); }
  .hint { color: var(--dim); font-size: 13px; margin-left: auto; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane .label { font-size: 13px; color: var(--dim); padding: 0 2px 6px; display: flex; justify-content: space-between; gap: 8px; }
  .pane .label b { color: var(--ink); font-weight: normal; }
  .pane .label a { color: var(--dim); }
  .frame { flex: 1; position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #000; }
  .frame iframe { position: absolute; left: 50%; top: 50%; border: 0; transform-origin: 50% 50%; background: #000; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } .hint { display: none; } }
</style>

<script>
(function () {
  var LIVE = 'https://balthazar.sh/', NEW = location.origin + '/';
  var N = 33, sel = document.getElementById('page'), A = document.getElementById('a'), B = document.getElementById('b');
  var shape = 'desktop';
  try { shape = localStorage.getItem('cmpShape') || 'desktop'; } catch (e) {}
  var SIZES = { desktop: [1280, 800], phone: [390, 844] };
  function fit() {
    var s = SIZES[shape];
    [A, B].forEach(function (f) {
      var box = f.parentNode.getBoundingClientRect(), k = Math.min(box.width / s[0], box.height / s[1]);
      f.style.width = s[0] + 'px'; f.style.height = s[1] + 'px';
      f.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
    });
  }
  // the book reads its page from #N and listens for hashchange, so changing only the hash turns the page without reloading
  function go(i, first) {
    i = Math.max(0, Math.min(N - 1, i)); sel.value = String(i);
    var h = i ? '#' + i : '';
    if (first) { A.src = LIVE + h; B.src = NEW + h; }
    else { A.src = LIVE + (h || '#0'); B.src = NEW + (h || '#0'); }
    try { history.replaceState(null, '', '#' + i); } catch (e) {}
  }
  function setShape(s) {
    shape = s; try { localStorage.setItem('cmpShape', s); } catch (e) {}
    document.querySelectorAll('[data-shape]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.shape === s)); });
    fit(); go(+sel.value, true);   // reload both so each book lays itself out for the new screen shape
  }
  document.getElementById('prev').onclick = function () { go(+sel.value - 1); };
  document.getElementById('next').onclick = function () { go(+sel.value + 1); };
  sel.onchange = function () { go(+sel.value); };
  document.querySelectorAll('[data-shape]').forEach(function (b) { b.onclick = function () { setShape(b.dataset.shape); }; });
  addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(+sel.value + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(+sel.value - 1); }
  });
  addEventListener('resize', fit);
  document.querySelectorAll('[data-shape]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.shape === shape)); });
  fit();
  go(parseInt((location.hash || '#1').slice(1), 10) || 0, true);
})();
</script>
