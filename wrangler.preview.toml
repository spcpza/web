# PREVIEW of the next version of the book (Oct 25 — Fred: "dont post it yet, we do it in preview.balthazar.sh
# … later i can actually survey real people"). A separate worker with its own copy of the assets, so the live
# book at balthazar.sh is never touched. Deploy:  npx wrangler deploy -c wrangler.preview.toml
name = "balthazar-preview"
main = "_worker.js"
compatibility_date = "2024-09-23"

routes = [
  { pattern = "preview.balthazar.sh", custom_domain = true }
]

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/", "/index.html", "/paper", "/paper.html", "/llms.txt", "/llms-full.txt"]
