name = "balthazar"
main = "_worker.js"
compatibility_date = "2024-09-23"

routes = [
  { pattern = "balthazar.sh/*", zone_name = "balthazar.sh" },
  { pattern = "www.balthazar.sh/*", zone_name = "balthazar.sh" }
]

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
# the page entry points run the worker first so it can send http:// to https:// (see _worker.js)
run_worker_first = ["/", "/index.html", "/paper", "/paper.html", "/llms.txt", "/llms-full.txt"]
