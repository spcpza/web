<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img">
        <title>The wrong hand — a small child in a busy store grips a coat that is almost the right color, while the right figure stands far behind, turned</title>

        <!-- store: wall and floor, child's eye height -->
        <rect width="800" height="500" fill="#f4efe2"/>
        <rect y="396" width="800" height="104" fill="#e7dfca"/>
        <line x1="0" y1="396" x2="800" y2="396" stroke="#d8cdae" stroke-width="1.5"/>

        <!-- ============ far background: the right figure, smaller, turned, searching ============ -->
        <g>
          <!-- soft shadow -->
          <ellipse cx="150" cy="428" rx="26" ry="4.5" fill="#3a352c" opacity="0.06"/>
          <!-- deep green coat, three-quarter turned -->
          <path fill="#4a5d33" d="M132,428
            C 130,398 130,370 135,350
            C 138,337 145,330 152,330
            C 159,330 165,337 168,350
            C 173,370 173,398 171,428 Z"/>
          <!-- head, turned away, looking elsewhere -->
          <circle cx="158" cy="319" r="11" fill="#4a5d33"/>
          <circle cx="167" cy="313" r="4.5" fill="#4a5d33"/>
          <!-- arm raised, holding the child's small red hat -->
          <path fill="#4a5d33" d="M167,352 C 174,345 179,339 183,332 L 190,337 C 185,345 179,352 172,359 Z"/>
          <!-- the child's little red hat, held up -->
          <path fill="#c44747" d="M185,331 a 7.5,7.5 0 0 1 15,0 Z"/>
          <rect x="182" y="330" width="21" height="3.5" rx="1.75" fill="#c44747"/>
          <!-- legs -->
          <rect x="140" y="426" width="8" height="18" fill="#3e4d2b"/>
          <rect x="156" y="426" width="8" height="18" fill="#3e4d2b"/>
          <path fill="#33402a" d="M137,443 L 150,443 L 152,449 L 134,449 Z"/>
          <path fill="#33402a" d="M153,443 L 166,443 L 168,449 L 150,449 Z"/>
        </g>

        <!-- ============ midground forest of coats and legs ============ -->
        <!-- far-left foreground coat, cropped by frame -->
        <g>
          <ellipse cx="30" cy="478" rx="60" ry="9" fill="#3a352c" opacity="0.08"/>
          <path fill="#8a6f44" d="M-20,-10 L 96,-10
            C 100,120 104,250 96,330
            C 92,366 80,386 46,386
            C 8,386 -10,366 -16,322 Z"/>
          <!-- coat opening -->
          <path fill="#74592f" d="M40,-10 L 50,-10 C 48,130 47,260 50,384 C 49,385 47,386 44,386 C 41,386 40,385 39,384 C 37,258 37,128 40,-10 Z"/>
          <!-- hem flare -->
          <path fill="#74592f" opacity="0.5" d="M-16,322 C -8,360 8,382 40,386 C 8,384 -6,362 -12,326 Z"/>
          <rect x="8" y="384" width="26" height="88" fill="#6e5836"/>
          <rect x="52" y="384" width="26" height="88" fill="#6e5836"/>
          <path fill="#54432a" d="M4,470 L 38,470 L 42,480 L 0,480 Z"/>
          <path fill="#54432a" d="M48,470 L 82,470 L 86,480 L 44,480 Z"/>
        </g>

        <!-- mid coat, sand, with a hanging sleeve and hand -->
        <g>
          <ellipse cx="232" cy="462" rx="48" ry="7" fill="#3a352c" opacity="0.07"/>
          <path fill="#c8b88a" d="M196,-10 L 272,-10
            C 276,110 278,230 270,302
            C 266,330 254,342 232,342
            C 206,342 196,328 193,290 Z"/>
          <!-- coat opening -->
          <path fill="#a08a5c" d="M230,-10 L 238,-10 C 237,120 237,230 239,338 C 237,340 235,341 232,341 C 230,341 229,340 228,339 C 227,228 227,118 230,-10 Z"/>
          <rect x="212" y="340" width="18" height="116" fill="#a08a5c"/>
          <rect x="242" y="340" width="18" height="116" fill="#a08a5c"/>
          <path fill="#7c6a44" d="M208,454 L 234,454 L 238,464 L 204,464 Z"/>
          <path fill="#7c6a44" d="M238,454 L 264,454 L 268,464 L 234,464 Z"/>
        </g>

        <!-- mid coat, muted gray, hem swinging — mid-stride -->
        <g>
          <ellipse cx="352" cy="452" rx="44" ry="7" fill="#3a352c" opacity="0.06"/>
          <path fill="#6e6657" d="M320,-10 L 388,-10
            C 392,100 394,210 386,278
            C 383,302 374,313 352,312
            C 330,311 320,296 317,262 Z"/>
          <!-- coat opening -->
          <path fill="#57503f" d="M350,-10 L 358,-10 C 357,110 357,210 359,308 C 357,310 355,311 352,311 C 350,311 349,310 348,309 C 347,208 347,108 350,-10 Z"/>
          <!-- legs mid-step: one forward, one back -->
          <path fill="#57503f" d="M332,308 L 348,310 L 342,448 L 326,446 Z"/>
          <path fill="#57503f" d="M358,310 L 374,308 L 382,446 L 366,448 Z"/>
          <path fill="#403a2c" d="M322,444 L 344,446 L 347,456 L 318,454 Z"/>
          <path fill="#403a2c" d="M364,446 L 386,444 L 390,454 L 361,456 Z"/>
        </g>

        <!-- THE WRONG COAT — olive, almost the right green -->
        <g>
          <ellipse cx="552" cy="468" rx="56" ry="8" fill="#3a352c" opacity="0.08"/>
          <path fill="#74824a" d="M504,-10 L 600,-10
            C 606,120 608,240 598,322
            C 594,350 582,364 554,364
            C 526,364 512,352 507,318
            C 503,288 502,140 504,-10 Z"/>
          <!-- coat opening, slightly parted -->
          <path fill="#5b6638" d="M548,-10 L 558,-10 C 557,130 557,250 559,360 C 557,362 555,363 552,363 C 549,363 547,362 546,361 C 545,248 545,128 548,-10 Z"/>
          <!-- hem fold pulled down into the child's hand -->
          <path fill="#74824a" d="M508,326 C 510,344 514,356 521,362 L 514,372 C 508,362 505,346 504,330 Z"/>
          <path fill="#5b6638" d="M514,372 L 521,362 C 526,366 532,369 540,370 C 530,372 521,373 514,372 Z"/>
          <!-- pull creases radiating from the grip -->
          <path fill="#5b6638" opacity="0.7" d="M516,366 C 524,358 530,348 534,336 L 538,338 C 534,350 527,360 519,368 Z"/>
          <path fill="#5b6638" opacity="0.45" d="M520,368 C 530,362 540,358 550,356 L 550,360 C 540,362 531,366 523,371 Z"/>
          <rect x="524" y="362" width="20" height="98" fill="#5b6638"/>
          <rect x="556" y="362" width="20" height="98" fill="#5b6638"/>
          <path fill="#444c2a" d="M520,458 L 548,458 L 552,470 L 516,470 Z"/>
          <path fill="#444c2a" d="M552,458 L 580,458 L 584,470 L 548,470 Z"/>
        </g>

        <!-- far-right foreground coat, cropped by frame -->
        <g>
          <ellipse cx="760" cy="482" rx="60" ry="9" fill="#3a352c" opacity="0.08"/>
          <path fill="#9b8a6a" d="M706,-10 L 820,-10 L 820,400
            C 800,414 776,420 752,418
            C 726,416 710,400 705,360
            C 699,250 700,120 706,-10 Z"/>
          <!-- coat opening -->
          <path fill="#86755a" d="M754,-10 L 764,-10 C 763,130 763,280 765,414 C 762,416 759,417 755,417 C 752,417 750,416 749,415 C 747,278 748,126 754,-10 Z"/>
          <rect x="724" y="416" width="24" height="58" fill="#7c6a44"/>
          <rect x="762" y="416" width="24" height="58" fill="#7c6a44"/>
          <path fill="#5e4f33" d="M720,472 L 750,472 L 754,482 L 716,482 Z"/>
          <path fill="#5e4f33" d="M758,472 L 788,472 L 792,482 L 754,482 Z"/>
        </g>

        <!-- ============ the child — focal point ============ -->
        <g>
          <ellipse cx="452" cy="476" rx="40" ry="7" fill="#3a352c" opacity="0.10"/>
          <!-- body: red sweater, stretched mid-reach toward the olive hem -->
          <path fill="#c44747" d="M428,420
            C 430,398 436,384 446,378
            C 452,374 460,374 466,378
            C 474,384 478,396 478,414
            L 472,422 L 434,426 Z"/>
          <!-- reaching arm up to the hem -->
          <path fill="#c44747" d="M466,386
            C 478,376 492,366 504,358
            L 512,368
            C 500,376 488,386 478,396 Z"/>
          <!-- hand gripping the pulled-down fold of the hem -->
          <circle cx="513" cy="365" r="7" fill="#e8c9a8"/>
          <!-- head, face up toward the coat -->
          <circle cx="446" cy="362" r="15" fill="#e8c9a8"/>
          <!-- hair -->
          <path fill="#3a352c" d="M432,358 C 432,348 438,340 447,339 C 455,338 461,343 462,350 C 456,346 450,345 444,348 C 438,351 434,355 432,358 Z"/>
          <!-- dot eye, looking up -->
          <circle cx="452" cy="357" r="1.8" fill="#3a352c"/>
          <!-- legs: one heel lifted, on tiptoe -->
          <rect x="436" y="420" width="13" height="48" rx="5" fill="#5a5247"/>
          <path fill="#5a5247" d="M458,418 L 472,420 L 468,460 L 456,458 Z"/>
          <!-- shoes -->
          <path fill="#3a352c" d="M433,466 L 450,466 L 453,474 L 430,474 Z"/>
          <path fill="#3a352c" d="M455,456 C 460,454 466,455 469,458 L 467,466 L 453,464 Z"/>
        </g>
      </svg>