<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img">
        <title>The shaking makes the roots go deeper — two trees in the same storm; below ground one tree's roots reach deep into gold light, the other's stay shallow and the trunk is tipping</title>
        <defs>
          <radialGradient id="p14-deep" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#f0d489" stop-opacity="0.50"/>
            <stop offset="0.55" stop-color="#f0d489" stop-opacity="0.14"/>
            <stop offset="1" stop-color="#f0d489" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- storm sky -->
        <rect width="800" height="310" fill="#6e6657"/>
        <!-- low cloud bands -->
        <path fill="#5a5247" d="M0,0 L 800,0 L 800,64 C 640,84 460,72 300,88 C 180,98 80,90 0,102 Z"/>
        <path fill="#635b4c" d="M0,118 C 170,104 380,116 560,104 C 660,98 740,104 800,98 L 800,128 C 640,136 440,126 260,138 C 160,144 70,138 0,146 Z"/>

        <!-- driving rain, all one diagonal -->
        <g stroke="#c8c0ad" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
          <line x1="120" y1="22" x2="84" y2="78"/>
          <line x1="220" y1="56" x2="184" y2="112"/>
          <line x1="316" y1="18" x2="280" y2="74"/>
          <line x1="420" y1="64" x2="384" y2="120"/>
          <line x1="512" y1="22" x2="476" y2="78"/>
          <line x1="616" y1="58" x2="580" y2="114"/>
          <line x1="710" y1="26" x2="674" y2="82"/>
          <line x1="158" y1="138" x2="122" y2="194"/>
          <line x1="268" y1="170" x2="232" y2="226"/>
          <line x1="372" y1="140" x2="336" y2="196"/>
          <line x1="478" y1="176" x2="442" y2="232"/>
          <line x1="582" y1="142" x2="546" y2="198"/>
          <line x1="690" y1="178" x2="654" y2="234"/>
          <line x1="62" y1="206" x2="26" y2="262"/>
          <line x1="330" y1="238" x2="294" y2="294"/>
          <line x1="540" y1="244" x2="504" y2="296"/>
          <line x1="744" y1="236" x2="708" y2="292"/>
        </g>

        <!-- thin grass strip at ground level -->
        <rect y="296" width="800" height="14" fill="#4a5d33"/>

        <!-- ============ the cutaway: below ground ============ -->
        <rect y="310" width="800" height="190" fill="#74592f"/>
        <rect y="310" width="800" height="3" fill="#54432a"/>
        <!-- darker depth -->
        <path fill="#5e4626" d="M0,396 C 180,388 420,394 620,388 C 700,386 760,390 800,388 L 800,500 L 0,500 Z"/>
        <!-- gold light held under the deepest roots -->
        <ellipse cx="244" cy="478" rx="200" ry="80" fill="url(#p14-deep)"/>

        <!-- ============ left tree — deep roots, gripping ============ -->
        <g>
          <!-- trunk, upright, leaning only a little into the wind -->
          <path fill="#8a6f44" d="M226,310
            C 228,268 230,228 230,192
            L 252,190
            C 254,228 258,268 262,310 Z"/>
          <!-- canopy bent hard by the same wind, but holding -->
          <path fill="#4a5d33" d="M242,200
            C 200,196 168,178 154,150
            C 176,152 196,150 210,140
            C 196,128 188,112 188,96
            C 210,106 232,110 252,106
            C 250,92 254,78 264,70
            C 270,84 282,96 298,102
            C 312,108 322,118 324,132
            C 308,132 296,138 290,148
            C 304,156 312,168 312,182
            C 290,176 268,180 254,194 Z"/>
          <!-- leaves torn loose, flying with the rain -->
          <ellipse cx="120" cy="142" rx="7" ry="4" fill="#4a5d33" transform="rotate(-32 120 142)"/>
          <ellipse cx="84" cy="176" rx="6" ry="3.5" fill="#4a5d33" transform="rotate(-32 84 176)"/>
          <!-- deep roots, reaching down and gripping -->
          <path fill="#8a6f44" d="M226,310 C 214,330 204,356 200,388 C 198,408 200,430 206,450 L 218,446 C 213,428 212,408 215,390 C 219,362 228,336 240,316 Z"/>
          <path fill="#8a6f44" d="M262,310 C 272,334 278,362 278,394 C 278,418 274,442 266,462 L 254,457 C 261,439 265,417 265,395 C 265,366 259,338 250,316 Z"/>
          <path fill="#8a6f44" d="M240,312 C 238,344 238,380 242,418 C 244,438 248,456 254,472 L 242,476 C 236,459 232,440 230,418 C 227,382 228,346 230,314 Z"/>
          <!-- root tips, curled like gripping fingers, in the gold -->
          <path fill="#8a6f44" d="M206,450 C 204,458 200,464 192,468 C 198,470 206,469 212,464 L 218,446 Z"/>
          <path fill="#8a6f44" d="M254,472 C 254,480 250,486 244,490 C 252,491 259,488 263,482 L 254,470 Z"/>
          <path fill="#8a6f44" d="M266,462 C 268,470 274,475 282,477 C 277,481 269,481 262,477 Z"/>
          <!-- side rootlets -->
          <path fill="#8a6f44" d="M215,390 C 206,392 198,397 192,404 L 198,410 C 204,403 211,398 218,396 Z"/>
          <path fill="#8a6f44" d="M265,400 C 274,403 281,409 286,417 L 279,422 C 274,414 268,409 262,406 Z"/>
        </g>

        <!-- ============ right tree — shallow roots, tipping ============ -->
        <g>
          <!-- trunk tipping away with the wind -->
          <path fill="#8a6f44" d="M560,312
            C 548,278 534,246 518,218
            L 536,206
            C 554,234 572,268 588,306 Z"/>
          <!-- canopy blown loose, thin -->
          <path fill="#4a5d33" d="M524,216
            C 482,216 450,202 434,178
            C 456,178 474,172 484,160
            C 472,150 466,136 468,122
            C 486,132 506,136 524,132
            C 526,146 534,158 548,164
            C 560,170 566,180 566,192
            C 552,190 540,194 532,204 Z"/>
          <!-- leaves stripped away -->
          <ellipse cx="402" cy="172" rx="7" ry="4" fill="#4a5d33" transform="rotate(-32 402 172)"/>
          <ellipse cx="366" cy="204" rx="6" ry="3.5" fill="#4a5d33" transform="rotate(-32 366 204)"/>
          <ellipse cx="428" cy="138" rx="5" ry="3" fill="#4a5d33" transform="rotate(-32 428 138)"/>
          <!-- ground bulging where the roots are pulling out -->
          <path fill="#4a5d33" d="M584,302 C 600,292 620,290 636,296 C 630,304 614,310 598,310 Z"/>
          <!-- shallow roots, sideways, barely under the grass -->
          <path fill="#8a6f44" d="M560,312 C 540,318 518,320 496,318 L 496,328 C 520,330 544,328 564,322 Z"/>
          <path fill="#8a6f44" d="M588,306 C 608,310 628,310 646,306 C 648,310 648,314 646,318 C 626,322 604,322 584,318 Z"/>
          <path fill="#8a6f44" d="M572,312 C 572,322 570,330 566,338 L 576,342 C 581,332 583,322 582,312 Z"/>
          <!-- one root snapped, lifted out of the soil into the air -->
          <path fill="#8a6f44" d="M640,306 C 652,300 660,292 664,282 L 672,288 C 667,299 658,308 646,314 Z"/>
        </g>
      </svg>
