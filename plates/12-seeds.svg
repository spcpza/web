<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img">
        <title>You grow what you plant — and rocks aren't harvests. The child plants a seed; one row is already a tomato plant heavy with fruit; off the rows lies a rock that nobody planted</title>
        <defs>
          <radialGradient id="p12-sun" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#f0d489" stop-opacity="0.45"/>
            <stop offset="0.6" stop-color="#f0d489" stop-opacity="0.12"/>
            <stop offset="1" stop-color="#f0d489" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- sky -->
        <rect width="800" height="500" fill="#f4efe2"/>
        <!-- morning sun, high left -->
        <circle cx="148" cy="92" r="120" fill="url(#p12-sun)"/>
        <circle cx="148" cy="92" r="26" fill="#f0d489"/>

        <!-- far hedge line -->
        <path fill="#aebd7d" d="M0,238 C 140,228 320,234 480,228 C 620,224 720,230 800,226 L 800,268 L 0,268 Z"/>
        <!-- grass field -->
        <path fill="#6a9b3e" d="M0,262 C 160,254 360,260 540,254 C 660,250 740,256 800,252 L 800,500 L 0,500 Z"/>

        <!-- ============ the garden plot — tilled earth, three rows ============ -->
        <path fill="#8a6f44" d="M96,332 C 220,320 420,324 580,318 L 632,452 C 460,462 250,458 60,468 Z"/>
        <!-- row mounds -->
        <path fill="#74592f" d="M130,352 C 250,344 410,346 540,342 L 548,362 C 414,366 252,364 124,372 Z"/>
        <path fill="#74592f" d="M112,396 C 240,388 414,390 556,386 L 566,408 C 420,412 246,410 104,420 Z"/>
        <path fill="#74592f" d="M92,442 C 230,434 420,436 578,432 L 586,452 C 432,456 240,454 84,464 Z"/>

        <!-- ============ the grown row — tomato plant heavy with red fruit ============ -->
        <g>
          <ellipse cx="196" cy="360" rx="52" ry="8" fill="#3a352c" opacity="0.08"/>
          <!-- stake -->
          <line x1="196" y1="356" x2="196" y2="252" stroke="#6e5836" stroke-width="5" stroke-linecap="round"/>
          <!-- foliage -->
          <circle cx="168" cy="282" r="30" fill="#6a9b3e"/>
          <circle cx="210" cy="262" r="34" fill="#6a9b3e"/>
          <circle cx="232" cy="296" r="26" fill="#4a5d33"/>
          <circle cx="178" cy="312" r="26" fill="#4a5d33"/>
          <circle cx="206" cy="318" r="20" fill="#6a9b3e"/>
          <!-- the fruit — the same red as the child -->
          <circle cx="170" cy="306" r="11" fill="#c44747"/>
          <circle cx="222" cy="288" r="12" fill="#c44747"/>
          <circle cx="196" cy="330" r="10" fill="#c44747"/>
          <circle cx="240" cy="312" r="9" fill="#c44747"/>
          <circle cx="156" cy="276" r="8" fill="#c44747"/>
          <!-- one fruit so heavy it rests on the soil -->
          <circle cx="252" cy="348" r="9" fill="#c44747"/>
        </g>

        <!-- a young sprout on the middle row — the wait in between -->
        <g>
          <path d="M338,396 C 338,388 338,382 338,376" stroke="#4a5d33" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path fill="#6a9b3e" d="M338,378 C 332,374 328,368 328,362 C 334,364 338,369 338,378 Z"/>
          <path fill="#6a9b3e" d="M338,378 C 344,374 348,368 348,362 C 342,364 338,369 338,378 Z"/>
        </g>

        <!-- ============ the child — kneeling on the near row, planting ============ -->
        <g>
          <ellipse cx="486" cy="446" rx="56" ry="9" fill="#3a352c" opacity="0.10"/>
          <!-- folded legs -->
          <path fill="#5a5247" d="M488,436 C 502,428 518,426 532,430 C 536,438 534,444 526,446 C 512,448 498,446 488,442 Z"/>
          <!-- shoe peeking behind -->
          <path fill="#3a352c" d="M530,432 C 538,430 544,432 546,436 L 542,444 L 528,440 Z"/>
          <!-- body: red sweater, bent forward over the soil -->
          <path fill="#c44747" d="M462,438
            C 460,414 466,394 480,384
            C 488,378 498,378 506,384
            C 516,392 521,406 520,424
            C 518,436 510,442 498,442
            C 484,442 470,442 462,438 Z"/>
          <!-- reaching arm, down to the ground -->
          <path fill="#c44747" d="M470,402 C 458,408 448,416 440,426 L 449,434 C 457,425 466,418 476,413 Z"/>
          <!-- hand at the soil, the seed just below the fingertips -->
          <circle cx="442" cy="431" r="7" fill="#e8c9a8"/>
          <!-- the seed -->
          <ellipse cx="436" cy="446" rx="4" ry="3" fill="#fbf9f3"/>
          <!-- the small hole it goes into -->
          <path fill="#54432a" d="M428,448 C 432,445 440,445 444,448 C 440,451 432,451 428,448 Z"/>
          <!-- head, bowed to the work -->
          <circle cx="478" cy="372" r="15" fill="#e8c9a8"/>
          <path fill="#3a352c" d="M464,370 C 464,360 470,352 479,351 C 487,350 493,355 494,362 C 488,358 482,357 476,360 C 470,363 466,367 464,370 Z"/>
          <circle cx="470" cy="372" r="1.8" fill="#3a352c"/>
        </g>

        <!-- ============ the rock — off the rows, on the grass, planted by no one ============ -->
        <g>
          <ellipse cx="688" cy="446" rx="42" ry="7" fill="#3a352c" opacity="0.09"/>
          <path fill="#9b9486" d="M650,442
            C 650,424 658,410 674,404
            C 690,398 708,402 718,414
            C 726,424 728,436 722,444
            C 706,448 668,448 650,442 Z"/>
          <path fill="#7e7869" d="M666,412 C 676,406 690,406 700,412 C 692,416 678,416 666,412 Z"/>
        </g>
      </svg>
