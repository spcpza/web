<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>van gogh plates — contact sheet</title>
<style>
  :root { --paper: #fbf9f3; --ink: #3a352c; --gray: #847d6e; --sand: #c8b88a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; line-height: 1.6; }
  main { max-width: 880px; margin: 0 auto; padding: 72px 24px 120px; }
  h1 { text-align: center; font-weight: normal; font-style: italic; font-size: 21px; letter-spacing: 0.04em; }
  .note-top { text-align: center; font-style: italic; color: var(--gray); font-size: 14px; margin: 14px 0 80px; }
  .note-top::after { content: ""; display: block; width: 48px; height: 1px; background: var(--sand); margin: 28px auto 0; }
  figure { margin: 0 0 110px; }
  figure:last-child { margin-bottom: 0; }
  .pair { display: flex; gap: 16px; align-items: flex-start; }
  .plate { border-radius: 6px; overflow: hidden; box-shadow: 0 1px 2px rgba(58,53,44,0.06), 0 14px 36px -16px rgba(58,53,44,0.22); }
  .plate img { display: block; width: 100%; height: auto; }
  .land { flex: 1 1 auto; min-width: 0; }
  .port { flex: 0 0 19%; }
  .title { text-align: center; font-style: italic; font-size: 18px; margin-top: 20px; }
  figcaption { text-align: center; font-style: italic; color: var(--gray); font-size: 15px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>van gogh plates — contact sheet</h1>
  <p class="note-top">43 plates from the atelier — every stroke authored</p>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/beginning.jpg" alt="In the beginning" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/beginning-p.jpg" alt="In the beginning (portrait)" loading="lazy"></div>
    </div>
    <p class="title">In the beginning</p>
    <figcaption>In the beginning was the Light.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/born.jpg" alt="Born again" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/born-p.jpg" alt="Born again (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Born again</p>
    <figcaption>Behold, all things become new.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/bread.jpg" alt="The Bread of Life" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/bread-p.jpg" alt="The Bread of Life (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The Bread of Life</p>
    <figcaption>Fed by the Light, every day.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/bridge.jpg" alt="The bridge" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/bridge-p.jpg" alt="The bridge (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The bridge</p>
    <figcaption>The bridge was built from the other side — and it was a cross.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/candle.jpg" alt="Go and shine" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/candle-p.jpg" alt="Go and shine (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Go and shine</p>
    <figcaption>You are the light of the world now — go and shine.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/come.jpg" alt="Come" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/come-p.jpg" alt="Come (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Come</p>
    <figcaption>Whosoever will — come.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/comes.jpg" alt="He is coming" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/comes-p.jpg" alt="He is coming (portrait)" loading="lazy"></div>
    </div>
    <p class="title">He is coming</p>
    <figcaption>Behold, I come quickly.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/family.jpg" alt="The family" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/family-p.jpg" alt="The family (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The family</p>
    <figcaption>You were given each other.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/flame.jpg" alt="He made the world" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/flame-p.jpg" alt="He made the world (portrait)" loading="lazy"></div>
    </div>
    <p class="title">He made the world</p>
    <figcaption>He made the world, and filled it with light.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/found.jpg" alt="The piece which I had lost" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/found-p.jpg" alt="The piece which I had lost (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The piece which I had lost</p>
    <figcaption>She lit a lamp and swept the house until she found it.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/garden.jpg" alt="Hiding in the dark" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/garden-p.jpg" alt="Hiding in the dark (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Hiding in the dark</p>
    <figcaption>He came looking — and would not leave you there.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/gift.jpg" alt="The gift" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/gift-p.jpg" alt="The gift (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The gift</p>
    <figcaption>Open your hand.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/gospel.jpg" alt="Alpha and Omega" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/gospel-p.jpg" alt="Alpha and Omega (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Alpha and Omega</p>
    <figcaption>a story about the Light</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/grave.jpg" alt="Three days" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/grave-p.jpg" alt="Three days (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Three days</p>
    <figcaption>They laid Him in the dark, and waited.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/hand.jpg" alt="The wrong hand" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/hand-p.jpg" alt="The wrong hand (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The wrong hand</p>
    <figcaption>The holding was real both times. The hand makes the difference.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/hands.jpg" alt="The threefold cord" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/hands-p.jpg" alt="The threefold cord (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The threefold cord</p>
    <figcaption>One slips. The others hold.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/library.jpg" alt="the library" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/library-p.jpg" alt="the library (portrait)" loading="lazy"></div>
    </div>
    <p class="title">the library</p>
    <figcaption>even the world itself could not contain the books.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/light.jpg" alt="He is the Light" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/light-p.jpg" alt="He is the Light (portrait)" loading="lazy"></div>
    </div>
    <p class="title">He is the Light</p>
    <figcaption>God is Light. God is Love.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/looking.jpg" alt="Love came looking" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/looking-p.jpg" alt="Love came looking (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Love came looking</p>
    <figcaption>But Love came looking for you.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/lost.jpg" alt="Lost" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/lost-p.jpg" alt="Lost (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Lost</p>
    <figcaption>A long way from home, and lost.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/love.jpg" alt="What C is — love" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/love-p.jpg" alt="What C is — love (portrait)" loading="lazy"></div>
    </div>
    <p class="title">What C is — love</p>
    <figcaption>Small acts with love.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/made.jpg" alt="Made to shine" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/made-p.jpg" alt="Made to shine (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Made to shine</p>
    <figcaption>You were made to carry His light.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/map.jpg" alt="Passing the map on" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/map-p.jpg" alt="Passing the map on (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Passing the map on</p>
    <figcaption>You can't give them your walking — but you can draw the map.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/newname.jpg" alt="A child, a new name" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/newname-p.jpg" alt="A child, a new name (portrait)" loading="lazy"></div>
    </div>
    <p class="title">A child, a new name</p>
    <figcaption>Now you are His own.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/nonight.jpg" alt="No more night" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/nonight-p.jpg" alt="No more night (portrait)" loading="lazy"></div>
    </div>
    <p class="title">No more night</p>
    <figcaption>And there shall be no night there.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/paid.jpg" alt="He paid the whole price" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/paid-p.jpg" alt="He paid the whole price (portrait)" loading="lazy"></div>
    </div>
    <p class="title">He paid the whole price</p>
    <figcaption>It cost the Light everything.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/pilot-fire.jpg" alt="The first flame (painted with fire)" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/pilot-fire-p.jpg" alt="The first flame (painted with fire) (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The first flame (painted with fire)</p>
    <figcaption>The same scene — but the flame painted itself.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/prayer.jpg" alt="Prayer" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/prayer-p.jpg" alt="Prayer (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Prayer</p>
    <figcaption>Sometimes the answer is 'I'm here'.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/ran.jpg" alt="He ran" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/ran-p.jpg" alt="He ran (portrait)" loading="lazy"></div>
    </div>
    <p class="title">He ran</p>
    <figcaption>You walk toward Him. He runs.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/risen.jpg" alt="He is risen" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/risen-p.jpg" alt="He is risen (portrait)" loading="lazy"></div>
    </div>
    <p class="title">He is risen</p>
    <figcaption>The grave could not hold the Light.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/road.jpg" alt="The long road home" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/road-p.jpg" alt="The long road home (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The long road home</p>
    <figcaption>The road brought you to the brink — the Light makes the way across.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/seeds.jpg" alt="Seeds" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/seeds-p.jpg" alt="Seeds (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Seeds</p>
    <figcaption>Whatever the child planted, grew.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/species.jpg" alt="After his kind" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/species-p.jpg" alt="After his kind (portrait)" loading="lazy"></div>
    </div>
    <p class="title">After his kind</p>
    <figcaption>Gen 1:12</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/storm.jpg" alt="The storm" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/storm-p.jpg" alt="The storm (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The storm</p>
    <figcaption>The shaking made the roots go deeper.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/string.jpg" alt="Who you are — and the drift" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/string-p.jpg" alt="Who you are — and the drift (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Who you are — and the drift</p>
    <figcaption>The string never snaps.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/together.jpg" alt="Side by side" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/together-p.jpg" alt="Side by side (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Side by side</p>
    <figcaption>He lets you help bring others home.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/turning.jpg" alt="The turning" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/turning-p.jpg" alt="The turning (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The turning</p>
    <figcaption>But you turned away.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/twoways.jpg" alt="Carried home" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/twoways-p.jpg" alt="Carried home (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Carried home</p>
    <figcaption>Love carried you home.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/washed.jpg" alt="Washed white" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/washed-p.jpg" alt="Washed white (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Washed white</p>
    <figcaption>Your stains washed white as snow.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/window.jpg" alt="The clean window" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/window-p.jpg" alt="The clean window (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The clean window</p>
    <figcaption>The cleaner the window, the faster you see.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/windows.jpg" alt="Two witnesses" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/windows-p.jpg" alt="Two witnesses (portrait)" loading="lazy"></div>
    </div>
    <p class="title">Two witnesses</p>
    <figcaption>Two windows, one garden.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/word.jpg" alt="the light of men" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/word-p.jpg" alt="the light of men (portrait)" loading="lazy"></div>
    </div>
    <p class="title">the light of men</p>
    <figcaption>In him was life; and the life was the light of men. — every verse, one body of light.</figcaption>
  </figure>
  <figure>
    <div class="pair">
      <div class="plate land"><img src="plates-vg/xray.jpg" alt="The X-ray, not the ladder" loading="lazy"></div>
      <div class="plate port"><img src="plates-vg/xray-p.jpg" alt="The X-ray, not the ladder (portrait)" loading="lazy"></div>
    </div>
    <p class="title">The X-ray, not the ladder</p>
    <figcaption>The picture shows. The doctor heals.</figcaption>
  </figure>
</main>
</body>
</html>
